    <!-- Theme Color: must match the real background of each theme, not a third colour. -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
  
    <!-- Painted in the head, not by React: the themed gradient is on a div inside the app,
         so before the bundle mounts a dark-theme visitor saw a white page. -->
    <style>html{background-color:#f8fafc}html.dark{background-color:#030712}</style>
    <script>
      // Same source of truth as ThemeContext, read before first paint.
      try {
        var t = localStorage.getItem('theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
</head>
