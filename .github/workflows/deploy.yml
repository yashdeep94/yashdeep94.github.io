# Build on every push to main and publish dist/ to the gh-pages branch.
# Replaces running `npm run deploy` by hand: no local node_modules needed, and the
# published build always matches what is on main.
name: Deploy to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-deploy from the Actions tab without a commit

permissions:
  contents: write           # required: the action pushes to the gh-pages branch

concurrency:                # a fast second push cancels the older in-flight deploy
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm       # caches ~/.npm between runs

      - name: Install dependencies
        run: npm ci        # uses package-lock.json exactly; fails if it is out of sync

      - name: Build
        run: npm run build

      - name: Publish dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
