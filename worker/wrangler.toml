name = "yash-portfolio-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Inference runs on Cloudflare's own GPUs through this binding. No API key, no card:
# it is included in the Workers FREE plan (10,000 Neurons/day). `env.AI` in the code.
[ai]
binding = "AI"

# Per-IP hourly cap, enabled 2026-10-19 before the widget went public. The endpoint is on the
# open internet and every call spends from the shared daily Neuron allocation, so without this
# one person with curl can burn the day and leave real visitors with "email him instead".
# The Worker uses this binding when present and skips it when absent, so it is safe to remove.
[[kv_namespaces]]
binding = "RATE"
id = "24312ac946d84488b2b71054dae04783"
