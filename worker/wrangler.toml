name = "yash-portfolio-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Inference runs on Cloudflare's own GPUs through this binding. No API key, no card:
# it is included in the Workers FREE plan (10,000 Neurons/day). `env.AI` in the code.
[ai]
binding = "AI"

# Optional per-IP hourly cap. The Worker uses it when present and skips it when absent,
# so deploying without it works. Create the namespace, then uncomment both lines:
#   npx wrangler kv namespace create RATE
# [[kv_namespaces]]
# binding = "RATE"
# id = "paste-the-id-wrangler-prints"
