name = "yash-portfolio-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Secret, NEVER put the key here. Set it once with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# wrangler.toml is committed; secrets are not.

# Optional per-IP hourly cap. Create the namespace, then uncomment both lines:
#   npx wrangler kv namespace create RATE
# [[kv_namespaces]]
# binding = "RATE"
# id = "paste-the-id-wrangler-prints"
